name: ptt_app
description: "Closed-network PTT Communicator"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  http: ^1.2.1
  web_socket_channel: ^3.0.1
  sqflite: ^2.3.3+1
  path: ^1.9.0
  path_provider: ^2.1.3
  uuid: ^4.4.0
  permission_handler: ^11.3.1
  mobile_scanner: ^5.1.1
  image_picker: ^1.1.1
  livekit_client: ^2.1.4
  flutter_foreground_task: ^6.1.1
  nearby_connections: ^4.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
